<div class="table-container">
  <table mat-table [dataSource]="livros" class="mat-elevation-z8">

    <!-- Título -->
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef> Título </th>
      <td mat-cell *matCellDef="let livro"> {{livro.titulo}} </td>
    </ng-container>

    <!-- Categoria -->
    <ng-container matColumnDef="categoria">
      <th mat-header-cell *matHeaderCellDef> Categoria </th>
      <td mat-cell *matCellDef="let livro"> {{livro.categoria}} </td>
    </ng-container>

    <!-- Disponível -->
    <ng-container matColumnDef="disponivel">
      <th mat-header-cell *matHeaderCellDef> Disponível </th>
      <td mat-cell *matCellDef="let livro"> {{livro.disponivel ? 'Sim' : 'Não'}} </td>
    </ng-container>

    <!-- Condição -->
    <ng-container matColumnDef="condicao">
      <th mat-header-cell *matHeaderCellDef> Condição </th>
      <td mat-cell *matCellDef="let livro"> {{livro.condicao}} </td>
    </ng-container>

    <!-- Ações -->
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef> Ações </th>
      <td mat-cell *matCellDef="let livro">
        <button mat-icon-button color="warn" (click)="excluirLivro(livro)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

<button mat-fab color="primary" class="add-btn" routerLink="/cadastrar">
  <mat-icon>add</mat-icon>
</button>
